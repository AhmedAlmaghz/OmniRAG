version: 2
updates:
  # Keep npm dependencies current, grouped weekly to reduce review noise.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types:
          - 'patch'
          - 'minor'
    # Auto-apply patch-level updates; surface majors for human review.
    auto-merge-allow-list:
      - 'eslint'
      - 'prettier'
      - 'vitest'
  # Keep GitHub Actions versions current.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
